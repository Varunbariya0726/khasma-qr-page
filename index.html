<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIPPIN'RITUAL Herbal Infusions</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/logo.png" alt="sippin ritual Logo" class="logo">

    </header>


    
<section class="welcome-section">

    <h1>
        SIPPIN'
        RITUAL
    </h1>

    <p class="subtitle">
        Herbal Infusions for Everyday Rituals
    </p>

    <p class="welcome-text">
        Discover the ritual made for you.
    </p>

    <a href="#tea-collection" class="explore-btn">
        Explore Teas ↓
    </a>


    <!-- LEFT HERBS -->

    <div class="herb herb-left left-1">
        <img src="images/body-lemonpeel.png" alt="Lemon Peel">
    </div>

    <div class="herb herb-left left-2">
        <img src="images/animation-levender.png" alt="Lavender">
    </div>

    <div class="herb herb-left left-3">
        <img src="images/herb-3.png" alt="Herb">
    </div>

    <div class="herb herb-left left-4">
        <img src="images/herb-4.png" alt="Herb">
    </div>


    <!-- RIGHT HERBS -->

    <div class="herb herb-right right-1">
        <img src="images/herb-5.png" alt="Herb">
    </div>

    <div class="herb herb-right right-2">
        <img src="images/herb-6.png" alt="Herb">
    </div>

    <div class="herb herb-right right-3">
        <img src="images/herb-7.png" alt="Herb">
    </div>

    <div class="herb herb-right right-4">
        <img src="images/herb-8.png" alt="Herb">
    </div>

</section>


    <!-- TEA COLLECTION -->
    <main id="tea-collection">


        <!-- 1 -->
        <section class="tea-section section-1">

            <div class="tea-content">

                <p class="tea-number">01</p>

                <img src="images/Refresh ritual.png" alt="Glow Ritual" class="tea-image">

            </div>

        </section>


        <!-- 2 -->
        <section class="tea-section section-2">

            <div class="tea-content">

                <p class="tea-number">02</p>

                <img src="images/Digest ritual.png" alt="Refresh Ritual" class="tea-image">

            </div>

        </section>


        <!-- 3 -->
        <section class="tea-section section-3">

            <div class="tea-content">

                <p class="tea-number">03</p>

                <img src="images/Glow ritual.png" alt="Digest Ritual" class="tea-image">

            </div>

        </section>


        <!-- 4 -->
        <section class="tea-section section-4">

            <div class="tea-content">

                <p class="tea-number">04</p>

                <img src="images/Focus ritual.png" alt="Her Ritual" class="tea-image">

            </div>

        </section>


        <!-- 5 -->
        <section class="tea-section section-5">

            <div class="tea-content">

                <p class="tea-number">05</p>

                <img src="images/Calm ritual.png" alt="Slimming Ritual" class="tea-image">

            </div>

        </section>




    </main>


    <!-- FINAL BRAND SECTION -->
    <footer class="brand-footer">

        <h2>Made for your daily ritual.</h2>




        <a href="https://www.instagram.com/sippin.rituals/" target="_blank" rel="noopener noreferrer"
            class="brand-link">
            <img src="images/instagram.svg" alt="Instagram" class="instagram-icon">

            <span>@sippin.rituals</span>
        </a>
    </footer>

</body>

</html>
