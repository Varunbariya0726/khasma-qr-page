<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIPPIN'RITUAL Herbal Infusions</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/logo.png" alt="Khasma Logo" class="logo">
    </header>


    <!-- WELCOME SECTION -->
    <section class="welcome-section">

        <h1>SIPPIN'
            RITUAL
        </h1>

        <p class="subtitle">
            Herbal Infusions for Everyday Rituals
        </p>

        <p class="welcome-text">
            Discover the ritual made for you.
        </p>

        <a href="#tea-collection" class="explore-btn">
            Explore Teas ↓
        </a>

    </section>


    <!-- TEA COLLECTION -->
    <main id="tea-collection">


        <!-- 1 -->
        <section class="tea-section section-1">

            <div class="tea-content">

                <p class="tea-number">01</p>

                <img src="images/Glow ritual.png" alt="Glow Ritual" class="tea-image">

            </div>

        </section>


        <!-- 2 -->
        <section class="tea-section section-2">

            <div class="tea-content">

                <p class="tea-number">02</p>

                <img src="images/Refresh ritual.png" alt="Refresh Ritual" class="tea-image">

            </div>

        </section>


        <!-- 3 -->
        <section class="tea-section section-3">

            <div class="tea-content">

                <p class="tea-number">03</p>

                <img src="images/Digest ritual.png" alt="Digest Ritual" class="tea-image">

            </div>

        </section>


        <!-- 4 -->
        <section class="tea-section section-4">

            <div class="tea-content">

                <p class="tea-number">04</p>

                <img src="images/Her ritual.png" alt="Her Ritual" class="tea-image">

            </div>

        </section>


        <!-- 5 -->
        <section class="tea-section section-5">

            <div class="tea-content">

                <p class="tea-number">05</p>

                <img src="images/Slimming ritual.png" alt="Slimming Ritual" class="tea-image">

            </div>

        </section>


        <!-- 6 -->
        <section class="tea-section section-6">

            <div class="tea-content">

                <p class="tea-number">06</p>

                <img src="images/Calm ritual.png" alt="Calm Ritual" class="tea-image">

            </div>

        </section>


        <!-- 7 -->
        <section class="tea-section section-7">

            <div class="tea-content">

                <p class="tea-number">07</p>

                <img src="images/Focus ritual.png" alt="Focus Ritual" class="tea-image">

            </div>

        </section>

    </main>


    <!-- FINAL BRAND SECTION -->
    <footer class="brand-footer">

        <h2>Made for your daily ritual.</h2>




        <a href="https://www.instagram.com/sippin.rituals/" target="_blank" rel="noopener noreferrer"
            class="brand-link">
            <img src="images/instagram.svg" alt="Instagram" class="instagram-icon">

            <span>@sippin.rituals</span>
        </a>
    </footer>

</body>

</html>
